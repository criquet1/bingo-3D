<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>3D Bingo Cage – Free Online Bingo Ball Draw</title>
  <meta name="description" content="Free online 3D bingo cage and number caller: draw bingo balls from a realistic animated cage, with voice calls, auto draw and a 75-ball board. Play in English or French.">
</head>
<body>
  <main>
    <section id="colonne-scene">
      <div id="scene">
        <button id="astuce-m" type="button">⌨️ Press M: menu</button>
        <div id="invite">👆 Click the cage to draw a ball</div>
      </div>
      <div id="boutons">
        <div id="menu-secondaire">
          <button id="btn-auto">⏱️ Auto draw</button>
          <button id="btn-son">🔊 Sound</button>
          <button id="btn-voix">🗣️ Voice: off</button>
          <button id="btn-reset">↺ Restart</button>
          <button id="btn-langue">🌐 Français</button>
        </div>
      </div>
      <p class="aide" id="aide">Click the cage (or the ball) to draw · drag to rotate · scroll to zoom · space bar to draw · M key to hide or show this menu</p>
    </section>

    <section id="panneau">
      <div id="compteur" aria-live="polite"></div>
      <div id="zone-tableau">
        <div id="tableau"></div>
        <div id="progres"><div></div></div>
      </div>
    </section>
  </main>

  <canvas id="confetti"></canvas>
  <script type="module" src="/src/main.js"></script>
</body>
</html>
